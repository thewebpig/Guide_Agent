<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="合肥工业大学工程管理与智能制造研究中心智能导览" />
    <title>工程管理与智能制造研究中心 · 智能导览</title>
    <link rel="stylesheet" href="/static/demo.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">合肥工业大学 · 屯溪路校区</p>
          <h1>工程管理与智能制造研究中心</h1>
        </div>
        <span id="configStatus" class="status">正在连接服务…</span>
      </header>
      <section class="notice" id="routeNotice">路线为仿真数据，具体走法请以现场标识为准。</section>
      <section class="chat-card">
        <div class="card-heading">
          <h2>智能导览助手</h2>
          <button id="clearButton" class="text-button" type="button" disabled>新对话</button>
        </div>
        <label class="location-control" for="currentLocation">
          <span>我的当前位置</span><select id="currentLocation" disabled></select>
        </label>
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="presets" class="presets" aria-label="常见问题"></div>
        <form id="chatForm" class="composer">
          <label class="sr-only" for="question">输入问题</label>
          <textarea id="question" rows="3" aria-describedby="inputHint" placeholder="例如：从主入口到第二学术报告厅怎么走？" disabled></textarea>
          <div class="composer-footer">
            <span id="inputHint">信息可能变化，请以学院最新通知和现场标识为准 · <b id="charCount">0/1000</b></span>
            <button id="sendButton" type="submit" disabled>发送</button>
          </div>
        </form>
        <details class="debug-card">
          <summary>查看本次回答依据</summary>
          <div id="tracePanel" class="trace-panel"></div>
        </details>
      </section>
    </main>
    <script src="/static/demo.js"></script>
  </body>
</html>

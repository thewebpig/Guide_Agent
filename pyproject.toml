[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guide-agent"
version = "0.1.0"
description = "A production-oriented LangChain + MCP visitor guide for the HFUT Management Center."
requires-python = ">=3.11,<3.12"
dependencies = [
    "faiss-cpu>=1.15,<2",
    "fastapi>=0.115,<1",
    "fastembed>=0.7,<1",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langchain-openai>=1.0,<2",
    "mcp>=1.30,<2",
    "numpy>=2,<3",
    "openai>=1.0,<3",
    "pydantic>=2.13,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guide_agent = ["static/*"]

[tool.uv]
package = true
